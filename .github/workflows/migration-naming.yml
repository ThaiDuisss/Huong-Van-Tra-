name: Migration naming

on:
  pull_request:
    paths:
      - '**/*.sql'
      - 'scripts/migrations/**'
      - '.github/workflows/migration-naming.yml'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  migration-naming:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check all migrations added since the PR base
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/migrations/check_migration_naming.py --base-ref "$MIGRATION_BASE"
      - name: Test naming and ordering checks
        run: python3 -B -m unittest discover -s scripts/migrations -p 'test_*.py'
