# nginx vhost cho web POS tren box 1.
#
# Dat o host (giong box 2 dang chay nginx/1.28.3 Ubuntu), KHONG phai container:
#   sudo cp deploy/nginx/pos.hvtra.id.vn.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/pos.hvtra.id.vn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pos.hvtra.id.vn        # xin cert, tu sua 2 dong ssl_* duoi
#
# pos-web (container) da publish 127.0.0.1:3000 va tu proxy /api/ sang api-gateway:8080,
# nen nginx o day chi can mot upstream duy nhat.
# Keycloak va MinIO da co nginx cong khai o box 2 -> KHONG proxy lai o day.

server {
    listen 80;
    listen [::]:80;
    server_name pos.hvtra.id.vn;

    # Chua co cert thi certbot dung duong nay de xac thuc.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # cu phap nginx >= 1.25; box 2 dang 1.28 nen dung duoc
    server_name pos.hvtra.id.vn;

    # certbot --nginx se ghi lai 4 dong duoi cho dung duong dan thuc te
    ssl_certificate     /etc/letsencrypt/live/pos.hvtra.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.hvtra.id.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # File upload di bang presigned URL TRUC TIEP len MinIO nen khong qua day,
    # nhung payload import san pham/JSON lon thi co. Mac dinh nginx chi 1MB.
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/pos-access.log;
    error_log  /var/log/nginx/pos-error.log;

    # API: thong bao dung SSE nen KHONG duoc buffer, va can timeout dai.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
