# nginx vhost cho web POS tren box 1. Dat o host (giong box 2 dang chay nginx/1.28.3
# Ubuntu cho auth + storage), khong phai container.
#
#   sudo cp deploy/nginx/pos.hvtra.id.vn.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/pos.hvtra.id.vn.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pos.hvtra.id.vn
#
# File nay CO Y chi khai HTTP. Neu khai san block 443 voi duong dan
# /etc/letsencrypt/live/... thi `nginx -t` fail ngay vi cert chua ton tai - khong
# khoi dong duoc nginx thi certbot cung khong xac thuc duoc: vong lap chet.
# `certbot --nginx` se COPY block duoi day thanh block 443, them cac dong ssl_*,
# va them redirect 80 -> 443. Moi location va header o day duoc giu nguyen.
#
# Dieu kien de certbot chay duoc:
#   1. pos.hvtra.id.vn phai phan giai ve IP public cua box 1
#   2. Security Group box 1 phai mo port 80 ra 0.0.0.0/0 (thu thach HTTP-01 di qua 80)
#
# pos-web (container) da publish 127.0.0.1:3000 va tu proxy /api/ sang api-gateway:8080,
# nen o day chi can mot upstream duy nhat. Keycloak va MinIO da co nginx cong khai o
# box 2 -> KHONG proxy lai o day.

server {
    listen 80;
    listen [::]:80;
    server_name pos.hvtra.id.vn;

    # Duong certbot dung de xac thuc HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # File upload di bang presigned URL TRUC TIEP len MinIO nen khong qua day,
    # nhung payload import san pham/JSON lon thi co. Mac dinh nginx chi 1MB.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/pos-access.log;
    error_log  /var/log/nginx/pos-error.log;

    # API: thong bao dung SSE nen KHONG duoc buffer, va can timeout dai.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
