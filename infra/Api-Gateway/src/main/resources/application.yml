
spring:
  application:
    name: Api-Gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.hvtra.id.vn/realms/hvt
          audiences: hvtra-api
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: customer-service
            uri: lb://customer-service
            predicates:
              - Path=/api/customer/**
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/orders/**
          - id: inventory-service
            uri: lb://inventory-service
            predicates:
              - Path=/api/inventory/**
          - id: payment-service
            uri: lb://payment-service
            predicates:
              - Path=/api/payments/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/notifications/**
          - id: catalog-service
            uri: lb://catalog-service
            predicates:
              - Path=/api/catalog/**
          - id: promotion-service
            uri: lb://promotion-service
            predicates:
              - Path=/api/promotions/**
          - id: identity-service
            uri: lb://identity-service
            predicates:
              - Path=/api/auth/**
          - id: reporting-service
            uri: lb://reporting-service
            predicates:
              - Path=/api/reports/**
          - id: organization-service
            uri: lb://organization-service
            predicates:
              - Path=/api/organizations/**

#          default-filters:
#            - name: RequestRateLimiter
#              args:
#                redis-rate-limiter.replenishRate: 10
#                redis-rate-limiter.burstCapacity: 20
#                redis-rate-limiter.requestedTokens: 1

          globalcors:
            cors-configurations:
              [ /** ]:
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "https://talenthub.fpt.edu.vn"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
