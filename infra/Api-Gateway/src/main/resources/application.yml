
spring:
  main:
    web-application-type: reactive
  application:
    name: Api-Gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.hvtra.id.vn/realms/hvt}
          audiences: ${KEYCLOAK_AUDIENCE:hvtra-pos}
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: customer-service
            uri: lb://customer-service
            predicates:
              - Path=/api/customer/**
            filters:
              - name: RequestRateLimiter
                args:
                  rate-limiter: "#{@customerRateLimiter}"
                  key-resolver: "#{@keycloakUserOrGuestKeyResolver}"
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/orders/**
          - id: inventory-service
            uri: lb://inventory-service
            predicates:
              - Path=/api/inventory/**
          - id: payment-service
            uri: lb://payment-service
            predicates:
              - Path=/api/payments/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/notifications/**
          - id: catalog-service
            uri: lb://catalog-service
            predicates:
              - Path=/api/catalog/**
          - id: promotion-service
            uri: lb://promotion-service
            predicates:
              - Path=/api/promotions/**
          - id: identity-service
            uri: lb://identity-service
            predicates:
              - Path=/api/identity/**
            filters:
              - name: RequestRateLimiter
                args:
                  rate-limiter: "#{@customerRateLimiter}"
                  key-resolver: "#{@keycloakUserOrGuestKeyResolver}"

          - id: reporting-service
            uri: lb://reporting-service
            predicates:
              - Path=/api/reports/**

          - id: employee-service
            uri: lb://employee-service
            predicates:
              - Path=/api/employee/**

          - id: file-service
            uri: lb://file-service
            predicates:
              - Path=/api/file/**

          - id: organization-service
            uri: lb://organization-service
            predicates:
              - Path=/api/organizations/**
            filters:
              - name: RequestRateLimiter
                args:
                  rate-limiter: "#{@customerRateLimiter}"
                  key-resolver: "#{@keycloakUserOrGuestKeyResolver}"
          - id: pos-bff
            uri: lb://pos-bff
            predicates:
              - Path=/api/pos/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
            add-to-simple-url-handler-mapping: true
  data:
    redis:
      host: 100.89.77.53
      port: 6379
      password: Hvt@2026

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    URLs:
      - name: identity-service
        url: /api/identity/v3/api-docs
      - name: notification-service
        url: /api/notifications/v3/api-docs
      - name: order-service
        url: /api/orders/v3/api-docs
      - name: payment-service
        url: /api/payments/v3/api-docs
      - name: catalog-service
        url: /api/catalog/v3/api-docs
      - name: customer-service
        url: /api/customer/v3/api-docs
      - name: promotion-service
        url: /api/promotions/v3/api-docs
      - name: file-service
        url: /api/file/v3/api-docs
      - name: reporting-service
        url: /api/reports/v3/api-docs
      - name: organization-service
        url: /api/organizations/v3/api-docs
      - name: inventory-service
        url: /api/inventory/v3/api-docs
      - name: employee-service
        url: /api/employee/v3/api-docs
      - name: pos-bff
        url: /api/pos/v3/api-docs
    enabled: true
    path: /swagger-ui.html

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}
