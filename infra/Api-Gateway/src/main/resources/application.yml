
spring:
  main:
    web-application-type: reactive
  application:
    name: Api-Gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.hvtra.id.vn/realms/hvt}
          audiences: ${KEYCLOAK_AUDIENCE:hvtra-pos}
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: customer-service
            uri: lb://customer-service
            predicates:
              - Path=/api/customer/**
            filters:
              - name: RequestRateLimiter
                args:
                  rate-limiter: "#{@customerRateLimiter}"
                  key-resolver: "#{@keycloakUserOrGuestKeyResolver}"
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/orders/**
          - id: inventory-service
            uri: lb://inventory-service
            predicates:
              - Path=/api/inventory/**
          - id: payment-service
            uri: lb://payment-service
            predicates:
              - Path=/api/payments/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/notifications/**
          - id: catalog-service
            uri: lb://catalog-service
            predicates:
              - Path=/api/catalog/**
          - id: promotion-service
            uri: lb://promotion-service
            predicates:
              - Path=/api/promotions/**
          - id: identity-service
            uri: lb://identity-service
            predicates:
              - Path=/api/identity/**
            filters:
              - name: RequestRateLimiter
                args:
                  rate-limiter: "#{@customerRateLimiter}"
                  key-resolver: "#{@keycloakUserOrGuestKeyResolver}"

          - id: ai-report-service
            uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8090}
            predicates:
              - Path=/api/recommendation/ai-reports,/api/recommendation/ai-reports/**

          - id: recommendation-serving
            uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8090}
            predicates:
              - Path=/api/recommendation/recommendations/*
              - Method=GET
            filters:
              - StripPrefix=2

          - id: file-service
            uri: lb://file-service
            predicates:
              - Path=/api/file/**

          - id: order-service-pos
            uri: lb://order-service
            predicates:
              - Path=/api/pos/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
            add-to-simple-url-handler-mapping: true
  data:
    redis:
      # Password KHONG de default: no la secret, va da nam trong git history -> phai rotate.
      # Chay local thi dat REDIS_PASSWORD trong env cua gateway.
      host: ${REDIS_HOST:100.99.2.30}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    URLs:
      - name: identity-service
        url: /api/identity/v3/api-docs
      - name: notification-service
        url: /api/notifications/v3/api-docs
      - name: order-service
        url: /api/orders/v3/api-docs
      - name: payment-service
        url: /api/payments/v3/api-docs
      - name: catalog-service
        url: /api/catalog/v3/api-docs
      - name: customer-service
        url: /api/customer/v3/api-docs
      - name: promotion-service
        url: /api/promotions/v3/api-docs
      - name: file-service
        url: /api/file/v3/api-docs
      - name: inventory-service
        url: /api/inventory/v3/api-docs
    enabled: true
    path: /swagger-ui.html

security:
  recommendation:
    customer-id-claim: ${RECOMMENDATION_CUSTOMER_ID_CLAIM:}
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET:kEV4x5IAXOxEnoEqPptGSYqS6Ujqly27dBhfjYp2pNc=}
  # Client Keycloak chứa client role dùng làm permission (xem services/Identity-Service/PERMISSIONS.md).
  permission-client-id: ${KEYCLOAK_PERMISSION_CLIENT_ID:hvtra-pos}
