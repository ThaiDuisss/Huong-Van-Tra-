# ===== Profile test =====
# Mặc định H2 in-memory: test KHÔNG BAO GIỜ fallback về DB dùng chung,
# và cũng không đòi biến môi trường nên `mvn test` trên Jenkins chạy xanh ngay.
#
# Vẫn giữ đường chạy với MySQL thật cho integration test khi cần:
#   ORDER_TEST_DB_URL=jdbc:mysql://... ORDER_TEST_DB_USERNAME=... ORDER_TEST_DB_PASSWORD=... \
#   ORDER_TEST_FLYWAY=true ORDER_TEST_DDL_AUTO=validate
# Flyway mặc định tắt vì migration viết cho MySQL, không chạy được trên H2.

spring:
  datasource:
    url: ${ORDER_TEST_DB_URL:jdbc:h2:mem:order;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${ORDER_TEST_DB_USERNAME:sa}
    password: ${ORDER_TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${ORDER_TEST_DDL_AUTO:create-drop}
    show-sql: false
  flyway:
    enabled: ${ORDER_TEST_FLYWAY:false}
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never
  cloud:
    discovery:
      enabled: false
  kafka:
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

kafka-config:
  enabled: false
