spring:
  application:
    name: Order-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://100.122.52.101:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:order_app}
    password: ${SPRING_DATASOURCE_PASSWORD:Hvt@2006}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 5000

server:
  port: 8086

springdoc:
  api-docs:
    enabled: true
    path: /api/orders/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/orders/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

kafka-config:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.122.52.101:19092}
  num-of-partitions: 3
  replication-factor: 1
#  schema-registry-url: http://localhost:8081

kafka-producer-config:
  enabled: true
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  enabled: true
  group-id: Order-Service-payment-events
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  payment-consumer-group-id: payment-topic-consumer
  inventory-deduct-consumer-group-id: inventory-deduct-topic-consumer
  customer-group-id: customer-topic-consumer
  promotion-group-id: promotion-topic-consumer
  auto-offset-reset: earliest
  batch-listener: false
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150



resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      paymentService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - feign.RetryableException
          - java.util.concurrent.TimeoutException
          - org.hvtra.commonservice.exception.FeignClientException
        ignore-exceptions:
          - feign.FeignException$Unauthorized

  bulkhead:
    instances:
      paymentService:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms

  ratelimiter:
    instances:
      paymentService:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 0

  timelimiter:
    instances:
      paymentService:
        timeoutDuration: 2s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus
          - circuitbreakers
          - circuitbreakerevents
          - retries
          - retryevents
          - ratelimiters
          - ratelimiterevents
          - bulkheads
          - bulkheadevents
          - timelimiters
          - timelimiterevents

  endpoint:
    health:
      show-details: always
clients:
  payment-service:
    url: http://localhost:8087
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
order:
  payment:
    events:
      topics:
        failed: payment.event.PAYMENT_FAILED
        waiting: payment.waiting-payment
        succeeded: payment.event.PAYMENT_SUCCEEDED
        expired: payment.expired
        cancelled: payment.cancelled
        need-review: payment.need-review

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}
