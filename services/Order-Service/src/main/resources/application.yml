spring:
  application:
    name: Order-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://100.122.52.101:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:order_app}
    password: ${SPRING_DATASOURCE_PASSWORD:Hvt@2006}

server:
  port: 8086

springdoc:
  api-docs:
    enabled: true
    path: /api/orders/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/orders/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

resilience4j:
  circuitbreaker:
    instances:
      customerService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      customerService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.FeignException
          - java.net.SocketTimeoutException
          - java.io.IOException