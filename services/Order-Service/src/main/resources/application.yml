spring:
  application:
    name: Order-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  cloud:
    openfeign:
      client:
        # Keyed by contextId (the client name when no contextId is set). Every client is listed
        # so none depends on the default by accident; "default" only covers clients added later.
        config:
          default:
            connectTimeout: 1000
            readTimeout: 5000

          payment-service:
            connectTimeout: 1000
            readTimeout: 5000

          catalog-service:
            connectTimeout: 1000
            readTimeout: 5000

          customBundleCatalogClient:
            connectTimeout: 1000
            readTimeout: 5000

          customer-service:
            connectTimeout: 1000
            readTimeout: 5000

          # Fulfilling a sale walks the FEFO batches and writes several rows; on a remote
          # development database it passes 5 s and the order was left inventory FAILED.
          inventory-service:
            connectTimeout: 2000
            readTimeout: 20000

          # Same service, own contextId: it never inherited the 20 s above and keeps the 1 s / 5 s
          # it has always run with.
          customBundleInventoryClient:
            connectTimeout: 1000
            readTimeout: 5000

server:
  port: 8086

springdoc:
  api-docs:
    enabled: true
    path: /api/orders/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/orders/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

kafka-config:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
  num-of-partitions: 3
  replication-factor: 1
#  schema-registry-url: http://localhost:8081

kafka-producer-config:
  enabled: true
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  enabled: true
  group-id: Order-Service-payment-events
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  payment-consumer-group-id: payment-topic-consumer
  inventory-deduct-consumer-group-id: inventory-deduct-topic-consumer
  customer-group-id: customer-topic-consumer
  promotion-group-id: promotion-topic-consumer
  auto-offset-reset: earliest
  batch-listener: false
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150



# Every Feign call runs as Retry( CircuitBreaker( Bulkhead( HTTP call ) ) ), applied inside the
# Feign proxy by client.resilience.ResilientFeignInvocationHandler - one instance per downstream
# service, shared by all Feign clients of that service.
#   - Circuit breaker + bulkhead: every call.
#   - Retry: only methods marked @IdempotentRead, only outside a DB transaction, one extra attempt,
#     and only if the first attempt failed within order.feign-resilience.retry-budget. Writes
#     (payment, stock, sellable quantity, loyalty) are sent exactly once.
#   - Only network errors and HTTP 5xx count as breaker failures; 4xx counts as a success.
#   - Breaker open / bulkhead full -> DownstreamUnavailableException -> HTTP 503, nothing sent.
# No timelimiter or ratelimiter: the calls are synchronous, so the Feign connect/read timeouts
# above are the time limit.
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        # An open breaker is reported in /actuator/health but must not turn it DOWN: Eureka uses
        # this health check and would take Order-Service out of rotation.
        allowHealthIndicatorToFail: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordFailurePredicate: org.hvtra.orderservice.client.resilience.DownstreamFailurePredicate
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
        eventConsumerBufferSize: 50
    instances:
      # Feign 1 s connect / 5 s read. Worst case per call:
      #   write, or any call inside a DB transaction: 1 attempt <= 6 s (same as without Resilience4j)
      #   read outside a transaction: <= 1.5 s budget + 0.2 s wait + 6 s second attempt = 7.7 s
      #   breaker open or bulkhead full: immediate 503
      paymentService:
        baseConfig: default
        slowCallDurationThreshold: 4s
      catalogService:
        baseConfig: default
        slowCallDurationThreshold: 4s
      customerService:
        baseConfig: default
        slowCallDurationThreshold: 4s
      # Feign 2 s connect / 20 s read (custom-bundle client: 1 s / 5 s). Worst case per call:
      #   write, or any call inside a DB transaction: 1 attempt <= 22 s (same as without Resilience4j)
      #   read outside a transaction: <= 2.5 s budget + 0.2 s wait + 22 s second attempt = 24.7 s
      #   breaker open or bulkhead full: immediate 503
      # The breaker stays open longer because Inventory needs longer to recover from a pile-up.
      inventoryService:
        baseConfig: default
        slowCallDurationThreshold: 15s
        waitDurationInOpenState: 20s

  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptionPredicate: org.hvtra.orderservice.client.resilience.TransientReadFailurePredicate
        eventConsumerBufferSize: 50
    instances:
      paymentService:
        baseConfig: default
      catalogService:
        baseConfig: default
      customerService:
        baseConfig: default
      inventoryService:
        baseConfig: default

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        # Never queue: a caller may be holding a DB transaction.
        maxWaitDuration: 0ms
        eventConsumerBufferSize: 50
    instances:
      paymentService:
        baseConfig: default
      catalogService:
        baseConfig: default
      customerService:
        baseConfig: default
      inventoryService:
        baseConfig: default

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus
          - circuitbreakers
          - circuitbreakerevents
          - retries
          - retryevents
          - bulkheads
          - bulkheadevents

  endpoint:
    health:
      show-details: always
clients:
  payment-service:
    url: http://localhost:8087
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
order:
  feign-resilience:
    # A failed read is retried only if it failed within this time: just above the Feign connect
    # timeout, so a refused/timed-out connection or a quick 502/503/504 is retried and a read
    # timeout is not paid twice.
    retry-budget:
      paymentService: 1500ms
      catalogService: 1500ms
      customerService: 1500ms
      inventoryService: 2500ms
  payment:
    events:
      topics:
        failed: payment.failed
        waiting: payment.waiting-payment
        succeeded: payment.succeeded
        expired: payment.expired
        cancelled: payment.cancelled
        need-review: payment.need-review
  inventory:
    events:
      topics:
        return-disposition-processed: ${ORDER_INVENTORY_RETURN_DISPOSITION_PROCESSED_TOPIC:inventory.event.RETURN_INVENTORY_DISPOSITION_PROCESSED}
        return-disposition-failed: ${ORDER_INVENTORY_RETURN_DISPOSITION_FAILED_TOPIC:inventory.event.RETURN_INVENTORY_DISPOSITION_FAILED}
      return-disposition-ack:
        group-id: ${ORDER_INVENTORY_RETURN_DISPOSITION_ACK_GROUP_ID:order-return-inventory-ack-events}
  return:
    inventory-reconciliation:
      enabled: ${ORDER_RETURN_INVENTORY_RECONCILIATION_ENABLED:true}
      fixed-delay-ms: ${ORDER_RETURN_INVENTORY_RECONCILIATION_FIXED_DELAY_MS:60000}
      pending-threshold-minutes: ${ORDER_RETURN_INVENTORY_RECONCILIATION_PENDING_THRESHOLD_MINUTES:5}
      batch-size: ${ORDER_RETURN_INVENTORY_RECONCILIATION_BATCH_SIZE:50}
      orphan-recovery:
        enabled: ${ORDER_RETURN_INVENTORY_ORPHAN_RECOVERY_ENABLED:true}
        not-found-threshold: ${ORDER_RETURN_INVENTORY_ORPHAN_NOT_FOUND_THRESHOLD:3}
        min-command-age-minutes: ${ORDER_RETURN_INVENTORY_ORPHAN_MIN_AGE_MINUTES:10}
        cooldown-minutes: ${ORDER_RETURN_INVENTORY_ORPHAN_COOLDOWN_MINUTES:10}
        max-recovery-attempts: ${ORDER_RETURN_INVENTORY_ORPHAN_MAX_ATTEMPTS:5}

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET}
