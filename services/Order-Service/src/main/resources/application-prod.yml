# ===== Profile prod — AWS box 1 "app" =====
# Kích hoạt bằng SPRING_PROFILES_ACTIVE=prod.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 900000
  jpa:
    show-sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  cloud:
    discovery:
      client:
        simple:
          instances:
            # CatalogClient và CustomBundleCatalogClient không có url -> đi qua discovery.
            catalog-service:
              - host: catalog-service
                port: 8081
                secure: false
            file-service:
              - host: file-service
                port: 8101
                secure: false

# Các Feign client còn lại của Order-Service dùng URL trực tiếp qua các property dưới đây.
clients:
  payment-service:
    # application.yml đang để http://localhost:8087.
    url: http://payment-service:8087
  inventory:
    # InventoryClient đọc clients.inventory.url trước, rồi mới tới clients.inventory-service.url.
    url: http://inventory-service:8084
  inventory-service:
    url: http://inventory-service:8084
  customer-service:
    # Có hiệu lực sau khi CustomerClient bỏ URL hardcode trong annotation.
    url: http://customer-service:8082

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  replication-factor: 1

# Prefix toàn bộ consumer group: dev và prod dùng chung cluster Kafka, trùng group id
# là mỗi message chỉ một bên nhận được.
kafka-consumer-config:
  group-id: ${KAFKA_GROUP_PREFIX:prod-}Order-Service-payment-events
  payment-consumer-group-id: ${KAFKA_GROUP_PREFIX:prod-}payment-topic-consumer
  inventory-deduct-consumer-group-id: ${KAFKA_GROUP_PREFIX:prod-}inventory-deduct-topic-consumer
  customer-group-id: ${KAFKA_GROUP_PREFIX:prod-}customer-topic-consumer
  promotion-group-id: ${KAFKA_GROUP_PREFIX:prod-}promotion-topic-consumer

order:
  inventory:
    events:
      return-disposition-ack:
        group-id: ${KAFKA_GROUP_PREFIX:prod-}order-return-inventory-ack-events

security:
  internal:
    header-secret: ${INTERNAL_HEADER_SECRET}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

management:
  endpoint:
    health:
      # application.yml để "always", lộ chi tiết datasource/kafka qua /actuator/health.
      show-details: never

logging:
  level:
    root: INFO
    org.hvtra: INFO
    org.hibernate.SQL: WARN
