# Profile cho integration test (@ActiveProfiles("it")): H2 in-memory ở chế độ MySQL,
# không Flyway (migration dùng cú pháp riêng MySQL), không Eureka, không Kafka.
spring:
  datasource:
    url: jdbc:h2:mem:customer_it;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,YEAR;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false
    openfeign:
      client:
        config:
          order-service:
            url: http://localhost:0

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

kafka-config:
  enabled: false

hvtra:
  logging:
    action-log:
      bootstrap-servers: ""

loyalty:
  tier:
    yearly-review:
      cron: "-"

security:
  internal:
    header-secret: it-header-secret
