server:
  port: 8082

spring:
  application:
    name: Customer-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

      client:
        config:
          order-service:
            connectTimeout: 300
            readTimeout: 700
            loggerLevel: basic

springdoc:
  api-docs:
    enabled: true
    path: /api/customer/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/customer/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

resilience4j:

  retry:
    instances:
      orderService:
        maxAttempts: 2
        waitDuration: 150ms

        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 300ms

        retryExceptionPredicate: >
          org.hvtra.customer.infrastructure.resilience.TransientFeignFailurePredicate

        eventConsumerBufferSize: 50


  circuitbreaker:
    instances:
      orderService:

        slidingWindowType: COUNT_BASED

        slidingWindowSize: 20

        minimumNumberOfCalls: 10

        failureRateThreshold: 50

        slowCallDurationThreshold: 600ms

        slowCallRateThreshold: 70

        waitDurationInOpenState: 15s

        permittedNumberOfCallsInHalfOpenState: 3

        automaticTransitionFromOpenToHalfOpenEnabled: true

        recordFailurePredicate: >
          org.hvtra.customer.infrastructure.resilience.OrderFailurePredicate

        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

        eventConsumerBufferSize: 100


  bulkhead:
    instances:
      orderService:
        maxConcurrentCalls: 20
        maxWaitDuration: 0ms
        eventConsumerBufferSize: 50


management:
  endpoints:
    web:
      exposure:
        include: >
          health,
          info,
          metrics,
          circuitbreakers,
          circuitbreakerevents,
          retries,
          retryevents,
          bulkheads,
          bulkheadevents
