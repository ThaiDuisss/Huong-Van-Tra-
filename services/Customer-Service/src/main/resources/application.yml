server:
  port: 8082

spring:
  application:
    name: Customer-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

      client:
        config:
          order-service:
            connectTimeout: 300
            readTimeout: 700
            loggerLevel: basic

springdoc:
  api-docs:
    enabled: true
    path: /api/customer/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/customer/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

resilience4j:

  retry:
    instances:
      orderService:
        maxAttempts: 2
        waitDuration: 150ms

        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 300ms

        retryExceptionPredicate: >
          org.hvtra.customer.infrastructure.resilience.TransientFeignFailurePredicate

        eventConsumerBufferSize: 50


  circuitbreaker:
    instances:
      orderService:

        slidingWindowType: COUNT_BASED

        slidingWindowSize: 20

        minimumNumberOfCalls: 10

        failureRateThreshold: 50

        slowCallDurationThreshold: 600ms

        slowCallRateThreshold: 70

        waitDurationInOpenState: 15s

        permittedNumberOfCallsInHalfOpenState: 3

        automaticTransitionFromOpenToHalfOpenEnabled: true

        recordFailurePredicate: >
          org.hvtra.customer.infrastructure.resilience.OrderFailurePredicate

        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

        eventConsumerBufferSize: 100


  bulkhead:
    instances:
      orderService:
        maxConcurrentCalls: 20
        maxWaitDuration: 0ms
        eventConsumerBufferSize: 50


management:
  endpoints:
    web:
      exposure:
        include: >
          health,
          info,
          metrics,
          circuitbreakers,
          circuitbreakerevents,
          retries,
          retryevents,
          bulkheads,
          bulkheadevents
 

kafka-config:
  enabled: false
  bootstrap-servers: 100.93.252.63:9092
  num-of-partitions: 3
  replication-factor: 3

kafka-producer-config:
  enabled: true
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: org.apache.kafka.common.serialization.JsonSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer
  auto-offset-reset: earliest
  batch-listener: true
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150

loyalty:
  tier:
    grace-period-months: 1
    yearly-review:
      month: 2
      day: 1
      cron: "0 0 1 1 2 *"
    events:
      order-completed-topic: order.completed
      order-partially-refunded-topic: order.partially-refunded
      order-fully-refunded-topic: order.fully-refunded

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}

# Action log gửi thẳng lên Kafka topic action.log (Identity-Service lưu DB),
# độc lập với kafka-config.enabled của service.
hvtra:
  logging:
    action-log:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.93.252.63:19092}
