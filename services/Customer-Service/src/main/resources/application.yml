server:
  port: 8082

spring:
  application:
    name: Customer-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

springdoc:
  api-docs:
    enabled: true
    path: /api/customer/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/customer/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# Customer-Service nhận chi tiêu / số đơn / điểm của khách qua Kafka (outbox của Order-Service),
# nên consumer phải bật.
kafka-config:
  enabled: ${KAFKA_ENABLED:true}
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
  num-of-partitions: 3
  replication-factor: 3

kafka-producer-config:
  enabled: true
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: org.apache.kafka.common.serialization.JsonSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  enabled: true
  group-id: customer-service-order-events
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  # Payload outbox được parse bằng DebeziumOutboxEventPayloadParser, nên nhận dạng chuỗi thô.
  value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  auto-offset-reset: earliest
  batch-listener: false
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150

customer:
  order-events:
    topics:
      order-completed: order.completed
      order-refunded: customer.order-refunded

loyalty:
  points:
    # Số tiền (VND) thanh toán để được 1 điểm, trước khi nhân hệ số của hạng.
    spend-per-point: 10000

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}

# Action log gửi thẳng lên Kafka topic action.log (Identity-Service lưu DB),
# độc lập với kafka-config.enabled của service.
hvtra:
  logging:
    action-log:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
