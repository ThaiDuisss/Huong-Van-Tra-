# ===== Profile prod — AWS box 1 "app" =====
# Kích hoạt bằng SPRING_PROFILES_ACTIVE=prod.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 900000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  cloud:
    discovery:
      client:
        simple:
          instances:
            file-service:
              - host: file-service
                port: 8101
                secure: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  replication-factor: 1

kafka-consumer-config:
  group-id: ${KAFKA_GROUP_PREFIX:prod-}Promotion-Service-order-events

security:
  internal:
    header-secret: ${INTERNAL_HEADER_SECRET}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  # Bỏ màu ANSI: log prod đi vào file/CloudWatch, escape code chỉ làm rác.
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'
  level:
    root: INFO
    org.hvtra: INFO
    org.hibernate.SQL: WARN
