spring:
  datasource:
    url: jdbc:h2:mem:catalog;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

clients:
  inventory:
    base-url: http://inventory-service/api/inventory

eureka:
  client:
    enabled: false
