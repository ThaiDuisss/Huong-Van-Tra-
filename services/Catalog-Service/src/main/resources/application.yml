spring:
  application:
    name: catalog-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://100.93.252.63:3306/catalog_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
      jdbc:
        batch_size: 500
      order_inserts: true

  flyway:
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
    baseline-version: "10"
clients:
  inventory:
    base-url: http://inventory-service/api/inventory

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /api/catalog/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/catalog/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}
