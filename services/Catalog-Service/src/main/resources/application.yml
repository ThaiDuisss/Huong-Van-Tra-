spring:
  application:
    name: Catalog-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://100.122.52.101:3306/catalog_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
clients:
  inventory:
    base-url: http://inventory-service/api/inventory

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /api/catalog/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/catalog/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
