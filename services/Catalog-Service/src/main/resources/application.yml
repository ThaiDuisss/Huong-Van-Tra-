spring:
  application:
    name: catalog-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
      jdbc:
        batch_size: 500
      order_inserts: true

  flyway:
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
    baseline-version: "10"
clients:
  inventory:
    base-url: http://inventory-service/api/inventory

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /api/catalog/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/catalog/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET}

# Action log gửi thẳng lên Kafka topic action.log (Identity-Service lưu DB),
# độc lập với kafka-config.enabled của service.
hvtra:
  logging:
    action-log:
      enabled: false
#      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}

kafka-config:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
  num-of-partitions: 3
  replication-factor: 1
#  schema-registry-url: http://localhost:8081

kafka-producer-config:
  enabled: true
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5
