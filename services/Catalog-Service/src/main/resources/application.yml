spring:
  application:
    name: catalog-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
      jdbc:
        batch_size: 500
      order_inserts: true

  flyway:
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
    baseline-version: "10"
clients:
  inventory:
    base-url: http://inventory-service/api/inventory

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /api/catalog/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/catalog/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET}

# Action log gửi thẳng lên Kafka topic action.log (Identity-Service lưu DB),
# độc lập với kafka-config.enabled của service.
hvtra:
  logging:
    action-log:
      enabled: false
#      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}

kafka-config:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
  num-of-partitions: 3
  replication-factor: 1
#  schema-registry-url: http://localhost:8081

kafka-producer-config:
  enabled: true
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  enabled: ${CATALOG_ORDER_CONSUMER_ENABLED:true}
  group-id: ${CATALOG_ORDER_CONSUMER_GROUP_ID:catalog-service-order-events}
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  auto-offset-reset: earliest
  batch-listener: false
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150

catalog:
  order-events:
    topics:
      order-completed: ${KAFKA_ORDER_COMPLETED_TOPIC:order.completed}
  outbox:
    item-sync:
      mode: ${CATALOG_ITEM_SYNC_MODE:CDC}
      cdc-fenced: ${CATALOG_ITEM_SYNC_CDC_FENCED:false}
      activation-id: ${CATALOG_ITEM_SYNC_ACTIVATION_ID:}
      bootstrap-servers: ${CATALOG_ITEM_SYNC_BOOTSTRAP_SERVERS:}
