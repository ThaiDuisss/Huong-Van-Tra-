spring:
  application:
    name: pos-bff

server:
  port: ${PORT:8095}

clients:
  catalog:
    url: ${CATALOG_SERVICE_URL:}

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  api-docs:
    enabled: true
    path: /api/pos/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/pos/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
security:
  internal:
    header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}
