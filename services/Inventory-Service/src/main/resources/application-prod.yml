# ===== Profile prod — AWS box 1 "app" =====
# Kích hoạt bằng SPRING_PROFILES_ACTIVE=prod.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 900000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # AGENTS.md: migration mới phải nối tiếp lịch sử với outOfOrder=false.
    # application.yml đang bật out-of-order: true cho tiện dev, prod phải tắt.
    out-of-order: false
  cloud:
    discovery:
      client:
        simple:
          instances:
            catalog-service:
              - host: catalog-service
                port: 8081
                secure: false
            order-service:
              - host: order-service
                port: 8086
                secure: false
            identity-service:
              - host: identity-service
                port: 8183
                secure: false
            file-service:
              - host: file-service
                port: 8101
                secure: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  replication-factor: 1

# Prefix consumer group để prod và dev KHÔNG giành message của nhau trên cùng cluster Kafka.
kafka-consumer-config:
  group-id: ${KAFKA_GROUP_PREFIX:prod-}Inventory-Service-order-events

inventory:
  order:
    events:
      return-disposition:
        group-id: ${KAFKA_GROUP_PREFIX:prod-}inventory-return-disposition

security:
  internal:
    header-secret: ${INTERNAL_HEADER_SECRET}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    root: INFO
    org.hvtra: INFO
    org.hibernate.SQL: WARN
