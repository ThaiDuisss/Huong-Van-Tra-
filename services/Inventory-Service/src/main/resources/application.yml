spring:
  application:
    name: Inventory-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          jdbc:
            batch_size: 50
          order_inserts: true
          order_updates: true
  flyway:
     baseline-on-migrate: true
     out-of-order: true
server:
  port: 8084

springdoc:
  api-docs:
    enabled: true
    path: /api/inventory/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/inventory/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

kafka-config:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
  num-of-partitions: 3
  replication-factor: 1

kafka-consumer-config:
  enabled: true
  group-id: Inventory-Service-order-events
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  auto-offset-reset: earliest
  batch-listener: false
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150

inventory:
  catalog:
    events:
      item-sync:
        group-id: inventory-catalog-item-sync
        topics:
          item-sync: catalog.event.ITEM_SYNC
  order:
    events:
      return-disposition:
        group-id: inventory-return-disposition
      topics:
        reservation-confirm: inventory.reservation-confirm.requested
        return-disposition-requested: order.event.RETURN_INVENTORY_DISPOSITION_REQUESTED
  outbox:
    publisher:
      mode: ${INVENTORY_OUTBOX_PUBLISHER_MODE:POLLING}
      cdc-fenced: ${INVENTORY_OUTBOX_PUBLISHER_CDC_FENCED:true}
      bootstrap-servers: ${INVENTORY_OUTBOX_PUBLISHER_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}}
      interval-ms: ${INVENTORY_OUTBOX_PUBLISHER_INTERVAL_MS:1000}
      batch-size: ${INVENTORY_OUTBOX_PUBLISHER_BATCH_SIZE:25}
      ack-timeout-ms: ${INVENTORY_OUTBOX_PUBLISHER_ACK_TIMEOUT_MS:12000}
      lease-ms: ${INVENTORY_OUTBOX_PUBLISHER_LEASE_MS:30000}
      retry-initial-ms: ${INVENTORY_OUTBOX_PUBLISHER_RETRY_INITIAL_MS:1000}
      retry-max-ms: ${INVENTORY_OUTBOX_PUBLISHER_RETRY_MAX_MS:120000}

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET}
