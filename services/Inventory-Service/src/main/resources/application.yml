spring:
  application:
    name: Inventory-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://100.93.252.63:3306/inventory_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:inventory_app}
    password: ${SPRING_DATASOURCE_PASSWORD:Hvt@2006}
  jpa:
      hibernate:
        ddl-auto: validate
      show-sql: false
      properties:
        hibernate:
          format_sql: true
  flyway:
     baseline-on-migrate: true
     out-of-order: true
server:
  port: 8084

springdoc:
  api-docs:
    enabled: true
    path: /api/inventory/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/inventory/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

kafka-config:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.93.252.63:19092}
  num-of-partitions: 3
  replication-factor: 1

kafka-consumer-config:
  enabled: true
  group-id: Inventory-Service-order-events
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  auto-offset-reset: earliest
  batch-listener: false
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150

inventory:
  order:
    events:
      return-disposition:
        group-id: inventory-return-disposition
      topics:
        reservation-confirm: inventory.reservation-confirm.requested
        return-disposition-requested: order.event.RETURN_INVENTORY_DISPOSITION_REQUESTED

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET}
