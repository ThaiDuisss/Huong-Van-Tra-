spring:
  application:
    name: Delivery-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:migration
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8188

springdoc:
  api-docs:
    enabled: true
    path: /api/delivery/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/delivery/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

kafka-config:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
  #  schema-registry-url-key: schema.registry.url
  #  schema-registry-url: http://localhost:8081
  num-of-partitions: 3
  replication-factor: 1

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer
  payment-consumer-group-id: payment-topic-consumer
  auto-offset-reset: earliest
  #  specific-avro-reader-key: specific.avro.reader
  #  specific-avro-reader: true
  batch-listener: true
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150


logging:
  level:
    org.springframework.kafka: WARN
security:
  internal:
    header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}

delivery:
  internal-routing:
    google-routes:
      enabled: ${GOOGLE_ROUTES_ENABLED:false}
      base-url: ${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
      api-key: ${GOOGLE_ROUTES_API_KEY:}
      travel-mode: ${GOOGLE_ROUTES_TRAVEL_MODE:DRIVE}
      routing-preference: ${GOOGLE_ROUTES_ROUTING_PREFERENCE:TRAFFIC_AWARE}
      avoid-tolls: ${GOOGLE_ROUTES_AVOID_TOLLS:false}
      avoid-highways: ${GOOGLE_ROUTES_AVOID_HIGHWAYS:false}
      avoid-ferries: ${GOOGLE_ROUTES_AVOID_FERRIES:true}
      failure-cooldown-seconds: ${GOOGLE_ROUTES_FAILURE_COOLDOWN_SECONDS:30}
  providers:
    ghn:
      enabled: true
      base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
      token: ${GHN_TOKEN}
      shop-id: ${GHN_SHOP_ID}
      client-id: ${GHN_CLIENT_ID}
      webhook-secret: ${GHN_WEBHOOK_SECRET}

    ahamove:
      enabled: ${AHAMOVE_ENABLED:false}
      base-url: ${AHAMOVE_BASE_URL:https://partner-apistg.ahamove.com}
      token: ${AHAMOVE_TOKEN:}
      webhook-auth-type: ${AHAMOVE_WEBHOOK_AUTH_TYPE:API_KEY}
      webhook-secret: ${AHAMOVE_WEBHOOK_SECRET:}
      webhook-username: ${AHAMOVE_WEBHOOK_USERNAME:}
