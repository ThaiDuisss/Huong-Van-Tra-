spring:
  application:
    name: identity-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8183

security:
  internal:
    header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}

springdoc:
  api-docs:
    enabled: true
    path: /api/identity/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/identity/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
        defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

idp:
  url: ${KEYCLOAK_URL:https://auth.hvtra.id.vn}
  client-id: ${KEYCLOAK_CLIENT_ID}
  clientSecret: ${KEYCLOAK_CLIENT_SECRET}
  realm: hvt
  # Service account (client-credentials) dùng để gọi Keycloak Admin REST API cho màn quản lý tài khoản.
  # Client này cần bật "Service accounts roles" và được gán realm-management: manage-users, view-users, view-realm.
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:hvtra-identity-admin}
  # Client chứa client role dùng làm permission (order:create, ...). Phải trùng security.permission-client-id của gateway.
  # Service account cần thêm realm-management: view-clients, manage-clients, view-realm, manage-realm.
  permission-client-id: ${KEYCLOAK_PERMISSION_CLIENT_ID:hvtra-pos}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:Xb86IbJRQ5L6rf9x3DMHSPE98KoEGq3S}


# ===== Action log (nhận từ Kafka topic action.log, lưu bảng action_log) =====
# Bật Kafka bằng KAFKA_ENABLED=true; mặc định tắt để chạy local không cần Kafka.
kafka-config:
  enabled: ${KAFKA_ENABLED:true}
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
  num-of-partitions: 3
  replication-factor: 1

hvtra:
  logging:
    action-log:
      topic: action.log
  action-log:
    max-poll-records: 500
    retry-attempts: 3
    retry-backoff-ms: 2000
    retention-days: ${ACTION_LOG_RETENTION_DAYS:365}
    purge:
      enabled: true
      cron: "0 0 3 * * *"
      batch-size: 5000
