spring:
  application:
    name: Identity-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://100.122.52.101:3306/identity_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:identity_app}
    password: ${SPRING_DATASOURCE_PASSWORD:Hvt@2026}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.hvtra.id.vn/realms/hvt
          audiences: hvtra-api
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: false
    locations: classpath:db/migration

server:
  port: 8083

springdoc:
  api-docs:
    enabled: true
    path: /api/identity/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/identity/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
        defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

idp:
  url: ${KEYCLOAK_URL}
  client-id: ${KEYCLOAK_CLIENT_ID}
  clientSecret: ${KEYCLOAK_CLIENT_SECRET}
  realm: hvt
