spring:
  application:
    name: identity-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://100.93.252.63:3306/identity_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:identity_app}
    password: ${SPRING_DATASOURCE_PASSWORD:Hvt@2026}
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8183

security:
  internal:
    header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}

springdoc:
  api-docs:
    enabled: true
    path: /api/identity/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/identity/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
        defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

idp:
  url: ${KEYCLOAK_URL}
  client-id: ${KEYCLOAK_CLIENT_ID}
  clientSecret: ${KEYCLOAK_CLIENT_SECRET}
  realm: hvt
