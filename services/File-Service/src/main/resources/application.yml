spring:
  application:
    name: File-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:migration
    baseline-on-migrate: true
    clean-disabled: true

#clients:
#  inventory:
#    base-url: http://inventory-service/api/inventory

server:
  port: 8101

springdoc:
  api-docs:
    enabled: true
    path: /api/file/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/file/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    public-bucket: hvt-file-public
    private-bucket: hvt-file-private
  presigned-upload-expiry-seconds: 300
  presigned-download-expiry-seconds: 300

file:
  storage:
    # Disable explicitly for read-only startup audits.
    initialize-buckets: true
  max-size-bytes: 10485760
  allowed-content-types:
    - image/png
    - image/jpeg
    - application/pdf

security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET:dev-internal-header-secret}

# Action log gửi thẳng lên Kafka topic action.log (Identity-Service lưu DB),
# độc lập với kafka-config.enabled của service.
hvtra:
  logging:
    action-log:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
