# ===== Profile prod — AWS box 1 "app" =====
# Kích hoạt bằng SPRING_PROFILES_ACTIVE=prod.
#
# Lưu ý vận hành: SePay gọi webhook POST /api/payments/webhooks/sepay từ internet,
# nên route /api/payments/** phải mở công khai qua Caddy + gateway và path webhook
# không được đòi JWT. Kiểm lại trước khi chạy thật.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 900000
  jpa:
    show-sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  cloud:
    discovery:
      client:
        simple:
          instances:
            # OrderClient không có url -> đi qua discovery.
            order-service:
              - host: order-service
                port: 8086
                secure: false
            file-service:
              - host: file-service
                port: 8101
                secure: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  replication-factor: 1

kafka-consumer-config:
  payment-consumer-group-id: ${KAFKA_GROUP_PREFIX:prod-}payment-topic-consumer

security:
  internal:
    header-secret: ${INTERNAL_HEADER_SECRET}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    root: INFO
    org.hvtra: INFO
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
