spring:
  application:
    name: Payment-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
#  jpa:
#    hibernate:
#      ddl-auto: validate

server:
  port: 8087

springdoc:
  api-docs:
    enabled: true
    path: /api/payments/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/payments/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

kafka-config:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.99.2.30:19092}
#  schema-registry-url-key: schema.registry.url
#  schema-registry-url: http://localhost:8081
  num-of-partitions: 3
  replication-factor: 1

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer
  payment-consumer-group-id: payment-topic-consumer
  auto-offset-reset: earliest
#  specific-avro-reader-key: specific.avro.reader
#  specific-avro-reader: true
  batch-listener: true
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150

payment:
  sepay:
    bankCode: MBBank
    account-number: ${SEPAY_BANK_ACCOUNT}
    account-name: ${SEPAY_BANK_ACCOUNT_NAME}
    store-name: HUONG VAN TRA
    qr-template: print
    payment-timeout-minutes: 15
    secret: ${SEPAY_SECRET}

logging:
  level:
    org.springframework.kafka: WARN
security:
  internal:
      header-secret: ${INTERNAL_HEADER_SECRET}
